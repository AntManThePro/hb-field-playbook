<script>
const MTP_VOICES=["Evan","Nathan","Samantha","Alex","Karen","Moira","Daniel","Google US English","Google UK English Female","Microsoft Zira"];
const synth=window.speechSynthesis;
function pickMtpVoice(){const voices=synth?synth.getVoices():[];for(const name of MTP_VOICES){const hit=voices.find(v=>(v.name||"").includes(name));if(hit)return hit;}return voices.find(v=>v.lang&&v.lang.startsWith("en"))||voices[0]||null;}
function talk(){const u=new SpeechSynthesisUtterance("Hood Boss field plate. This is the MyTechPix voice.");u.rate=.88;u.pitch=1;const v=pickMtpVoice();if(v)u.voice=v;synth.cancel();synth.speak(u);}
</script>
<button onclick="talk()">Test voice</button>
